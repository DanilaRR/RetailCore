services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: webstore-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: site
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Security Service (port 8082)
  security-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.security
    container_name: webstore-security-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/site
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

  # Item Service (port 8081)
  item-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.item
    container_name: webstore-item-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/site
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend (port 5173)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rettailcore-frontend
    ports:
      - "5173:5173"
    depends_on:
      - item-service
      - security-service

volumes:
  postgres-data:
