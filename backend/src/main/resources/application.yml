spring:
  application:
    name: webstore

  datasource:
    url: jdbc:postgresql://localhost:5432/site
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false  # Recommended for better performance

  sql:
    init:
      mode: always  # Ensures initialization scripts run if needed

  main:
    allow-bean-definition-overriding: true
